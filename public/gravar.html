<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Raízes · Conte sua história</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌳</text></svg>">
<link rel="stylesheet" href="/styles.css">
<style>
  body { font-size: 21px; min-height: 100vh; display: flex; flex-direction: column; }
  .top { text-align: center; padding: 22px 16px 0; font: 600 20px var(--serif); color: var(--sage); }
  main { flex: 1; max-width: 560px; width: 100%; margin: 0 auto; padding: 20px 22px 40px; display: flex; flex-direction: column; justify-content: center; gap: 22px; text-align: center; }
  h1 { font-size: 34px; font-weight: 400; }
  .q { font: 400 28px/1.35 var(--serif); padding: 28px 24px; background: var(--card); border-radius: 24px; border: 1px solid var(--line); box-shadow: var(--shadow); }
  .big { font-size: 22px; padding: 22px 30px; width: 100%; border-radius: 20px; }
  .rec { width: 168px; height: 168px; border-radius: 50%; border: 0; margin: 6px auto; cursor: pointer; background: var(--accent); color: #fff; font: 700 20px var(--sans);
    display: grid; place-items: center; box-shadow: 0 12px 30px #b4552d55, 0 0 0 10px #b4552d18; transition: transform .15s; }
  .rec:active { transform: scale(.96); }
  .rec svg { width: 54px; height: 54px; }
  .rec.on { background: #c62f2f; animation: pulse 1.4s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 #c62f2f66; } 70% { box-shadow: 0 0 0 26px #c62f2f00; } 100% { box-shadow: 0 0 0 0 #c62f2f00; } }
  .timer { font: 600 30px var(--sans); color: #c62f2f; font-variant-numeric: tabular-nums; }
  .help { color: var(--ink-2); font-size: 19px; }
  audio { width: 100%; }
  textarea { font-size: 20px; min-height: 160px; }
  .link { background: none; border: 0; color: var(--ink-2); text-decoration: underline; font-size: 18px; cursor: pointer; }
  .spinner { width: 54px; height: 54px; border: 5px solid var(--line); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="top">🌳 Raízes</div>
<main id="app"><div class="spinner"></div></main>
<div class="toast" id="toast"></div>
<script>
const TOKEN = location.pathname.split('/').pop();
const app = document.getElementById('app');
const esc = (s = '') => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toast = (m, err) => { const t = document.getElementById('toast'); t.textContent = m; t.className = 'toast show' + (err ? ' err' : ''); setTimeout(() => t.className = 'toast', 4000); };
const MIC = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>';
let S = null, rec = null, chunks = [], blob = null, tStart = 0, tTimer = null, poll = null, lastQ = null;

async function load() {
  const r = await fetch(`/api/g/${TOKEN}`);
  if (!r.ok) { app.innerHTML = `<h1>Link inválido</h1><p class="help">Peça um novo link para a sua família.</p>`; return; }
  S = await r.json();
  render();
}

function render() {
  clearInterval(poll);
  const p = S.pronoun, P = p[0].toUpperCase() + p.slice(1);
  if (S.status !== 'active') {
    app.innerHTML = `<h1>Olá, ${esc(S.call_name)}! 💛</h1>
      <p class="help">${esc(S.requester_name || 'Sua família')} pediu para guardarmos as histórias da sua vida, na sua própria voz.</p>
      <p class="help">Toda semana aparece uma pergunta aqui. ${P} aperta o botão e conta, do jeitinho que lembrar.</p>
      <button class="btn big sage" id="ok">Vamos começar</button>`;
    document.getElementById('ok').onclick = async (e) => {
      e.target.disabled = true;
      const r = await fetch(`/api/g/${TOKEN}/consent`, { method: 'POST' });
      if (!r.ok) toast((await r.json()).error || 'Erro', true);
      load();
    };
    return;
  }
  const c = S.conversation;
  if (c?.processing) {
    app.innerHTML = `<div class="spinner"></div><h1>Ouvindo sua história…</h1><p class="help">Só um instante.</p>`;
    lastQ = c.question; startPolling(); return;
  }
  if (!c) {
    app.innerHTML = `<h1>Obrigada, ${esc(S.call_name)}! 💛</h1>
      <p class="help">${S.stories ? `Já guardamos ${S.stories} ${S.stories > 1 ? 'histórias suas' : 'história sua'}.` : ''} A próxima pergunta aparece aqui em breve.</p>
      <p class="help">Lembrou de alguma coisa e quer contar agora?</p>
      ${recorderHTML('Contar uma história')}`;
    bindRecorder(); return;
  }
  app.innerHTML = `<div class="q">${esc(c.question).replace(/\n/g, '<br>')}</div>
    ${c.audioId ? `<button class="btn ghost big" id="listen">🔊 Ouvir a pergunta</button>` : ''}
    ${recorderHTML('Aperte para falar')}`;
  if (c.audioId) document.getElementById('listen').onclick = () => new Audio(`/api/g/${TOKEN}/audio/${c.audioId}`).play();
  bindRecorder();
}

const recorderHTML = (label) => `<div id="rec-area">
    <button class="rec" id="rec" aria-label="Gravar">${MIC}</button>
    <div class="help" id="rec-label">${label}</div>
    <div class="timer" id="timer" hidden>0:00</div>
  </div>
  <div id="review" hidden>
    <p class="help">Escute se quiser e depois envie:</p>
    <audio id="preview" controls></audio>
    <button class="btn big sage" id="send" style="margin-top:14px">✓ Enviar</button>
    <button class="link" id="redo" style="margin-top:12px">Gravar de novo</button>
  </div>
  <button class="link" id="write">Prefiro escrever</button>
  <div id="write-area" hidden><textarea id="text" placeholder="Escreva aqui…"></textarea><button class="btn big" id="send-text" style="margin-top:12px">Enviar</button></div>`;

function bindRecorder() {
  const $ = (id) => document.getElementById(id);
  $('rec').onclick = async () => {
    if (rec?.state === 'recording') return stop();
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
      const type = ['audio/webm;codecs=opus', 'audio/mp4', 'audio/webm', 'audio/ogg'].find(t => window.MediaRecorder?.isTypeSupported?.(t)) || '';
      rec = new MediaRecorder(stream, type ? { mimeType: type } : {});
      chunks = [];
      rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);
      rec.onstop = () => {
        stream.getTracks().forEach(t => t.stop());
        blob = new Blob(chunks, { type: rec.mimeType || 'audio/webm' });
        $('preview').src = URL.createObjectURL(blob);
        $('rec-area').hidden = true; $('review').hidden = false;
      };
      rec.start(1000);
      tStart = Date.now();
      $('rec').classList.add('on'); $('rec').innerHTML = '<b>PARAR</b>';
      $('rec-label').textContent = 'Gravando… aperte para terminar'; $('timer').hidden = false;
      tTimer = setInterval(() => { const s = Math.floor((Date.now() - tStart) / 1000); $('timer').textContent = `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; if (s >= 900) stop(); }, 250);
    } catch { toast('Não consegui usar o microfone. Toque em "Permitir" quando o celular perguntar.', true); }
  };
  function stop() { clearInterval(tTimer); rec.stop(); }
  $('redo').onclick = () => { blob = null; render(); };
  $('send').onclick = async (e) => {
    e.target.disabled = true; e.target.textContent = 'Enviando…';
    const fd = new FormData(); fd.append('audio', blob, 'resposta.' + (blob.type.includes('mp4') ? 'm4a' : 'webm'));
    await submit(fd);
  };
  $('write').onclick = () => { $('write-area').hidden = false; $('write').hidden = true; $('text').focus(); };
  $('send-text').onclick = async () => {
    const t = $('text').value.trim(); if (!t) return;
    const fd = new FormData(); fd.append('text', t); await submit(fd);
  };
}

async function submit(fd) {
  lastQ = S.conversation?.question;
  app.innerHTML = `<div class="spinner"></div><h1>Guardando com carinho…</h1>`;
  const r = await fetch(`/api/g/${TOKEN}/answer`, { method: 'POST', body: fd });
  if (!r.ok) { toast((await r.json().catch(() => ({}))).error || 'Não consegui enviar. Tente de novo.', true); return load(); }
  app.innerHTML = `<div class="spinner"></div><h1>Que lindo! 💛</h1><p class="help">Ouvindo sua história…</p>`;
  startPolling();
}

function startPolling() {
  clearInterval(poll);
  let n = 0;
  poll = setInterval(async () => {
    n++;
    const r = await fetch(`/api/g/${TOKEN}`); if (!r.ok) return;
    const s = await r.json();
    const changed = !s.conversation || (!s.conversation.processing && s.conversation.question !== lastQ);
    if (changed || n > 40) { S = s; render(); }
  }, 3000);
}

load();
</script>
</body>
</html>
